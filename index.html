<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SEGFAULT: Ngõ 165 — Cinematic Engine</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06090d;
      color: #ece9e2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at center, rgba(16, 24, 34, 0.86), rgba(4, 7, 10, 0.98) 78%);
    }
    #start-card {
      width: min(560px, calc(100vw - 32px));
      padding: 32px;
      background: rgba(11, 16, 22, 0.94);
      border: 1px solid rgba(215, 224, 232, 0.16);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9cb2c4;
    }
    h1 {
      margin: 10px 0 12px;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.65;
      color: #b7c0c8;
      font-size: 14px;
    }
    button {
      border: 0;
      background: #dce6ee;
      color: #0b1117;
      padding: 12px 22px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
    button:hover {
      background: #ffffff;
    }
    button:disabled {
      opacity: 0.45;
      cursor: wait;
    }
    #asset-status {
      margin-top: 18px;
      padding: 12px 14px;
      background: rgba(6, 10, 14, 0.85);
      border: 1px solid rgba(215, 224, 232, 0.12);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #a4b1bc;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    #eyelid-veil {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000000;
      opacity: 0;
      pointer-events: none;
    }
    #cinematic-vignette {
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 54%, rgba(2, 5, 10, 0.56) 100%);
    }
    #subtitle {
      position: fixed;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      z-index: 12;
      max-width: 82vw;
      text-align: center;
      font-size: clamp(15px, 1.45vw, 22px);
      line-height: 1.45;
      color: #f3f4f6;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 18px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      display: none;
    }
    #intro-hud {
      position: fixed;
      right: 24px;
      bottom: 20px;
      z-index: 12;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(220, 228, 236, 0.78);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }
    #intro-hud[hidden] {
      display: none;
    }
    #debug-bar {
      position: fixed;
      left: 16px;
      top: 14px;
      z-index: 14;
      padding: 8px 12px;
      background: rgba(8, 12, 18, 0.78);
      border: 1px solid rgba(215, 224, 232, 0.15);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #c2ced8;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <div id="start-card">
      <div class="eyebrow">FIRST-PERSON CINEMATIC PIPELINE · GLB + PBR + HDRI</div>
      <h1>SEGFAULT: Ngõ 165</h1>
      <p>Hệ thống render điện ảnh Three.js đọc trực tiếp tài nguyên 3D (.glb), ánh sáng HDRI và hoạt ảnh xương xuất từ Blender.</p>
      <button id="start-btn" type="button" disabled>ĐANG KIỂM TRA ASSETS...</button>
      <div id="asset-status">Đang khởi tạo...</div>
    </div>
  </div>
  <div id="cinematic-vignette"></div>
  <div id="eyelid-veil"></div>
  <div id="subtitle" role="status"></div>
  <div id="intro-hud" hidden>SPACE · BỎ QUA INTRO &nbsp;|&nbsp; D · BẬT/TẮT DEBUG</div>
  <div id="debug-bar"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
